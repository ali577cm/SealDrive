name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret missing - signing with debug key; in-app updates will not install over other builds"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PappVersionCode=$((GITHUB_RUN_NUMBER + 100)) 2>&1 | tee build.log || {
            # surface compiler/Gradle errors as annotations so they are visible without downloading logs
            grep -E "^e: |^w: .*error|What went wrong|Execution failed|error:|Caused by" -A2 build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BYDrive.apk
          cp BYDrive.apk SealDrive.apk   # old installs still look for this file name
          CODE=$((GITHUB_RUN_NUMBER + 100))
          gh release create "v$CODE" BYDrive.apk SealDrive.apk --title "Build $CODE" --generate-notes
      - uses: actions/upload-artifact@v4
        with: { name: BYDrive-apk, path: BYDrive.apk }
